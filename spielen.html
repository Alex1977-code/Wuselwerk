<title>Wuselwerk</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#05070c;color:#dce6f5;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overscroll-behavior:none}#spielfeld{display:block;width:100vw;height:100dvh;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

:root {
  color-scheme: dark;
  --grund: #05070c;
  --panel: #0e131c;
  --linie: #27334a;
  --text: #dce6f5;
  --leise: #7b8ba3;
  --akzent: #ffd23f;
}
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  background: var(--grund);
  color: var(--text);
  overflow: hidden;
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
}
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.rahmen {
  width: 100%;
  height: 100%;
  position: relative;
  background: var(--grund);
}
#spielfeld {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.fusszeile { display: none; }

/* Auf breiten Schirmen in Gerätegrösse zeigen statt breitziehen. Quer, weil
   das Spiel dorthin geht; das Hochformat funktioniert weiter, sobald das
   Fenster höher als breit ist. */
@media (min-width: 560px) {
  body { padding: 24px; box-sizing: border-box; }
  .rahmen {
    width: min(844px, calc(100vw - 48px));
    aspect-ratio: 844 / 390;
    height: auto;
    border: 1px solid var(--linie);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
  }
  .fusszeile {
    display: block;
    max-width: 46ch;
    text-align: center;
    font-size: 12px;
    line-height: 1.6;
    color: var(--leise);
    margin: 0;
  }
  .fusszeile b { color: var(--akzent); font-weight: 600; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
<div class="rahmen"><canvas id="spielfeld"></canvas></div>
<p class="fusszeile">Erst einen <b>Beruf</b> wählen, dann eine Figur antippen. Finger gedrückt halten bremst die Zeit auf ein Viertel und blendet die Lupe ein.</p>
