*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#05070c;color:#dce6f5;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overscroll-behavior:none}#spielfeld{display:block;width:100vw;height:100dvh;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

:root {

  --grund: #05070c;

}
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  background: var(--grund);
  color: var(--text);
  overflow: hidden;
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
}
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

.rahmen {
  width: 100%;
  height: 100%;
  position: relative;
  background: var(--grund);
}
#spielfeld {
  display: block;
  width: 100%;

  touch-action: none;

  body { padding: 24px; box-sizing: border-box; }
  .rahmen {
    width: min(844px, calc(100vw - 48px));

}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
