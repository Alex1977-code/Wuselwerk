name: Pages

# Baut den Prototyp und veroeffentlicht ihn auf GitHub Pages.
# Der Zweig unten ist der Standardzweig des Repos — nur von dort darf die
# github-pages-Umgebung standardmaessig deployen.

on:
  push:
    branches:
      - claude/new-session-yyor38
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Veroeffentlichungen nicht abbrechen, aber auch nicht ueberholen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Playwright wird nur fuer die lokale Sichtprobe gebraucht; der Browser-
      # Download wuerde den Lauf um Minuten verlaengern.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typen prüfen
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Bauen (Normalfassung und Einzeldatei)
        run: npm run build:single

      # Setzt voraus, dass Pages im Repo einmalig freigeschaltet ist:
      # Settings -> Pages -> Source: GitHub Actions.
      # Das laesst sich hier nicht automatisieren — das Token eines Workflows
      # darf Pages nicht anlegen ("Resource not accessible by integration").
      # Nur ein Repo-Besitzer kann den Schalter umlegen, danach laeuft alles
      # bei jedem Push von allein.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
