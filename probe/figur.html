<style>
  /* `?nackt` schaltet den Untergrund ab, damit der Bildschirmabzug echtes
     Alpha behaelt — daran haengt die Messung der Ueberdeckung. */
  body { margin: 0; background: #1a1c20; color: #d6dae0;
         font: 13px/1.4 system-ui, sans-serif; }
  body.nackt { background: transparent; }
  canvas { display: block; image-rendering: auto; }
</style>
<canvas id="c"></canvas>
<script>
  if (new URLSearchParams(location.search).has('nackt')) document.body.classList.add('nackt');
</script>
